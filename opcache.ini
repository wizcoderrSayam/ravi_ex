; OPcache settings for this project. PHP does not read this file from the project:
; it only takes effect once someone with root links it into PHP's config
; directory, which Hostinger shared hosting (production) doesn't allow - see
; "Hostinger shared hosting" below. Kept so the intended values are recorded if
; the site moves to a server with root.
;
; Check what is actually live over HTTP, not on the CLI - php -i reports the
; CLI's own OPcache, which is a different process with different settings:
;
;   echo '<?php print_r(opcache_get_configuration()["directives"]);' > public/_o.php
;   curl https://ravi.peerprojects.in/_o.php && rm public/_o.php
;
; OPcache needs a persistent process. It does nothing under the CGI or suPHP
; handlers, where every request is a fresh PHP.

[opcache]
opcache.enable = 1

; Left off: the CLI's cache dies with the process, so it only costs startup
; time, and it breaks tools that rewrite files mid-run (pint).
opcache.enable_cli = 0

; ~9,600 PHP files in app + vendor (fewer with --no-dev), plus compiled Blade views.
; max_accelerated_files is rounded up to the next prime step (16229).
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 16000

; opcache.validate_timestamps is left at its default (1): PHP-FPM can't be
; reloaded here, so OPcache has to notice changed files by itself after a deploy.

; Required: Laravel and its packages read docblocks via reflection.
opcache.save_comments = 1

; Hostinger shared hosting
; ------------------------
; Without root, a user can only set OPcache directives that are INI_ALL, which in
; a public/.user.ini means these three and nothing else:
;
;   opcache.enable, opcache.validate_timestamps, opcache.revalidate_freq
;
; Every line above that sets memory, file counts or save_comments is INI_SYSTEM
; and is ignored there. Those three already default to on/on/2s, so a .user.ini
; is worth adding only if OPcache is switched off - check with the curl above,
; and if "enable" is false, this turns it back on:
;
;   echo 'opcache.enable = 1' > public/.user.ini
;
; PHP re-reads .user.ini every 5 minutes (user_ini.cache_ttl), so give it that
; long to take effect. Real tuning needs a server with root.
