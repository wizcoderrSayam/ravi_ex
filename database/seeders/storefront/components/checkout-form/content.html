<section class="mx-auto max-w-5xl px-4 py-10">
  <h1 class="text-3xl font-bold" data-role="heading">Checkout</h1>

  <div class="mt-8 hidden rounded-lg border border-emerald-200 bg-emerald-50 p-8 text-center" data-role="done">
    <i class="fa-solid fa-circle-check text-4xl text-emerald-600"></i>
    <h2 class="mt-3 text-2xl font-semibold" data-role="done-title">Thank you!</h2>
    <p class="mt-2 text-slate-600" data-role="done-text"></p>
    <a href="/shop" class="mt-6 inline-block rounded-md bg-teal-600 px-5 py-2.5 font-semibold text-white hover:bg-teal-700">Continue shopping</a>
  </div>

  <div class="mt-8 hidden text-slate-600" data-role="unavailable">
    Checkout isn't available right now. <a href="/contact-us" class="text-teal-700 hover:underline">Contact us</a> to buy or ask about a product.
  </div>

  <div class="mt-8 hidden rounded-lg border border-slate-200 bg-white p-8 text-center" data-role="empty">
    <p class="text-slate-600">Your cart is empty.</p>
    <a href="/shop" class="mt-4 inline-block rounded-md bg-teal-600 px-5 py-2.5 font-semibold text-white hover:bg-teal-700">Browse the shop</a>
  </div>

  <div class="mt-8 hidden gap-8 md:grid-cols-5" data-role="main">
    <form class="space-y-5 md:col-span-3" data-role="form" novalidate>
      <div class="hidden gap-2 rounded-lg border border-slate-200 bg-white p-1 sm:grid-cols-2" data-role="modes">
        <label class="cursor-pointer rounded-md px-3 py-2 text-center text-sm font-medium has-[:checked]:bg-teal-600 has-[:checked]:text-white">
          <input type="radio" name="mode" value="order" class="sr-only" checked> Place an order
        </label>
        <label class="cursor-pointer rounded-md px-3 py-2 text-center text-sm font-medium has-[:checked]:bg-teal-600 has-[:checked]:text-white">
          <input type="radio" name="mode" value="enquiry" class="sr-only"> Send an enquiry
        </label>
      </div>

      <div class="hidden rounded-md bg-rose-50 px-4 py-3 text-sm text-rose-700" data-role="error"></div>

      <div class="grid gap-4 sm:grid-cols-2">
        <label class="block text-sm font-medium">Full name
          <input name="name" required autocomplete="name" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 font-normal">
        </label>
        <label class="block text-sm font-medium">Email
          <input name="email" type="email" required autocomplete="email" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 font-normal">
        </label>
        <label class="block text-sm font-medium sm:col-span-2">Phone
          <input name="phone" type="tel" autocomplete="tel" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 font-normal">
        </label>
      </div>

      <div class="grid gap-4 sm:grid-cols-2" data-role="address">
        <label class="block text-sm font-medium sm:col-span-2">Address
          <textarea name="address" rows="2" autocomplete="street-address" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 font-normal"></textarea>
        </label>
        <label class="block text-sm font-medium">City
          <input name="city" autocomplete="address-level2" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 font-normal">
        </label>
        <label class="block text-sm font-medium">State
          <input name="state" autocomplete="address-level1" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 font-normal">
        </label>
        <label class="block text-sm font-medium">Postal code
          <input name="postal_code" autocomplete="postal-code" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 font-normal">
        </label>
      </div>

      <label class="block text-sm font-medium"><span data-role="note-label">Order notes (optional)</span>
        <textarea name="note" rows="3" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 font-normal"></textarea>
      </label>

      <button type="submit" data-role="submit" class="w-full rounded-md bg-teal-600 px-5 py-3 font-semibold text-white hover:bg-teal-700 disabled:opacity-60">Place order</button>
    </form>

    <aside class="h-fit rounded-lg border border-slate-200 bg-white p-5 md:col-span-2">
      <h2 class="mb-3 font-semibold">Your items</h2>
      <ul class="divide-y divide-slate-100" data-role="lines"></ul>
      <dl class="mt-4 space-y-1 border-t border-slate-200 pt-4 text-sm" data-role="totals"></dl>
    </aside>
  </div>
</section>
