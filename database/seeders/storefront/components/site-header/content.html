<header class="sticky top-0 z-40 border-b border-slate-200 bg-white/95 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-4">
    <a href="/" class="flex items-center gap-2 text-lg font-bold text-teal-700">
      <i class="fa-solid fa-store"></i>
      <span data-role="brand">Store</span>
    </a>
    <nav class="hidden md:block" aria-label="Main">
      <ul class="flex items-center gap-1" data-role="menu"></ul>
    </nav>
    <div class="flex items-center gap-1">
      <button type="button" data-role="cart" hidden class="relative rounded-full p-2 text-slate-700 hover:bg-slate-100" aria-label="Open cart">
        <i class="fa-solid fa-bag-shopping text-lg"></i>
        <span data-role="count" class="absolute -right-1 -top-1 hidden min-w-5 rounded-full bg-teal-600 px-1 text-center text-xs font-semibold leading-5 text-white">0</span>
      </button>
      <button type="button" data-role="toggle" class="rounded p-2 text-slate-700 hover:bg-slate-100 md:hidden" aria-label="Menu">
        <i class="fa-solid fa-bars text-lg"></i>
      </button>
    </div>
  </div>
  <nav class="hidden border-t border-slate-100 bg-white md:hidden" data-role="mobile" aria-label="Mobile">
    <ul class="px-4 py-2" data-role="mobile-menu"></ul>
  </nav>
</header>
